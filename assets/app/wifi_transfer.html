<!doctype html>
<html lang="zh" __THEME_PLACEHOLDER__>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VidLang WiFi</title>
<style>
:root{--bg:#000;--bg2:#0d0d0d;--bg3:#141414;--border:#222;--border2:#1a1a1a;--text:#e0e0e0;--text2:#888;--text3:#555;--accent:#4284FC;--accent-bg:rgba(66,132,252,.18);--accent-bg2:rgba(66,132,252,.06);--accent-bg3:rgba(66,132,252,.05);--hover:#1a1a1a;--scroll:#333;--danger:#FF453A;--success:#30D158;--shadow:rgba(0,0,0,.4)}
[data-theme="light"]{--bg:#fff;--bg2:#f5f5f5;--bg3:#fafafa;--border:#e0e0e0;--border2:#eee;--text:#212121;--text2:#666;--text3:#999;--accent:#4284FC;--accent-bg:rgba(66,132,252,.12);--accent-bg2:rgba(66,132,252,.04);--accent-bg3:rgba(66,132,252,.03);--hover:#f0f0f0;--scroll:#ccc;--danger:#d32f2f;--success:#2e7d32;--shadow:rgba(0,0,0,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column}
/* Header */
.header{padding:10px 18px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.header h1{font-size:18px;font-weight:700;color:var(--text);letter-spacing:.5px}
.header .sub{font-size:11px;color:var(--text2);margin-top:1px}

/* Upload status bar */
.upload-status-bar{display:none;padding:8px 18px;background:var(--accent-bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.upload-status-bar.active{display:block}
.upload-status-content{display:flex;align-items:center;gap:10px}
.upload-status-icon{width:16px;height:16px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-status-text{flex:1;font-size:12px;color:var(--text2)}
.upload-status-text strong{color:var(--text);font-weight:500}
.upload-status-progress{font-size:11px;color:var(--accent);white-space:nowrap}
.upload-progress-bar{height:2px;background:var(--border);border-radius:1px;margin-top:6px;overflow:hidden}
.upload-progress-fill{height:100%;background:var(--accent);border-radius:1px;transition:width .3s ease;width:0%}
/* Main */
.main{display:flex;flex:1;overflow:hidden}
/* Sidebar */
.sidebar{width:240px;min-width:240px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;flex-shrink:0}
.sidebar-title{padding:12px 14px 8px;font-size:11px;text-transform:uppercase;color:var(--text3);letter-spacing:.5px;flex-shrink:0}
.tree{flex:1;overflow-y:auto;padding:0 6px 8px}
.tree::-webkit-scrollbar{width:4px}
.tree::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:2px}
.category{margin-bottom:4px}
.cat-header{display:flex;align-items:center;padding:6px 8px;border-radius:6px;cursor:default;font-size:13px;font-weight:600;color:var(--text2)}
.cat-header .cat-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin-right:6px;flex-shrink:0}
.cat-header .cat-icon svg{width:16px;height:16px;fill:var(--text2)}
.cat-header .cat-label{flex:1}
.cat-header .cat-add{width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px;cursor:pointer;font-size:14px;color:var(--text3);opacity:0;transition:all .15s}
.cat-header:hover .cat-add{opacity:1}
.cat-add:hover{background:var(--hover);color:var(--accent)}
.cat-children{padding-left:20px}
.folder-item{display:flex;align-items:center;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text2);margin:1px 0;transition:background .1s}
.folder-item:hover{background:var(--hover);color:var(--text)}
.folder-item.active{background:var(--accent-bg);color:var(--accent);font-weight:500}
.folder-item .f-icon{width:16px;height:16px;margin-right:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.folder-item .f-icon svg{width:14px;height:14px;fill:currentColor}
.folder-item .f-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-item .f-del{width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:3px;cursor:pointer;font-size:12px;color:var(--text3);opacity:0;transition:all .15s}
.folder-item:hover .f-del{opacity:1}
.folder-item .f-del:hover{color:var(--danger);background:rgba(244,67,54,.1)}
/* Content */
.content{flex:1;display:flex;flex-direction:column;overflow:hidden;padding:14px 18px 0}
.content-header{flex-shrink:0;margin-bottom:12px}
.content-header .breadcrumb{font-size:13px;color:var(--text2)}
.content-header .breadcrumb strong{color:var(--text);font-weight:600}
/* Upload area */
.upload-area{margin-bottom:12px;flex-shrink:0}
.upload-zone{border:2px dashed var(--scroll);border-radius:10px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone.dragover{border-color:var(--accent);background:var(--accent-bg2)}
.upload-zone .icon{font-size:28px;color:var(--text3);margin-bottom:6px}
.upload-zone p{font-size:13px;color:var(--text2)}
.upload-zone .ext-hint{font-size:11px;color:var(--text3);margin-top:4px}
/* Toolbar */
.toolbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-shrink:0;gap:8px;flex-wrap:wrap}
.toolbar-left{display:flex;align-items:center;gap:8px}
.toolbar-left .selected-count{font-size:12px;color:var(--text2)}
.toolbar-right{display:flex;gap:6px}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:none;transition:all .15s;font-family:inherit}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{opacity:.9}
.btn-primary:disabled{background:var(--scroll);color:var(--text3);cursor:default}
.btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(244,67,54,.3)}
.btn-danger:hover{background:rgba(244,67,54,.1)}
.btn-danger:disabled{color:var(--text3);border-color:var(--border2);cursor:default}
.btn-ghost{background:transparent;color:var(--text2)}
.btn-ghost:hover{background:var(--hover);color:var(--text)}
/* Table */
.table-wrap{flex:1;overflow:auto;border-radius:8px;border:1px solid var(--border2)}
.table-wrap::-webkit-scrollbar{width:6px;height:6px}
.table-wrap::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{position:sticky;top:0;z-index:1}
th{background:var(--bg2);padding:8px 10px;text-align:left;font-weight:500;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--border2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border2);color:var(--text2);vertical-align:middle}
tr:hover td{background:var(--hover)}
tr.selected td{background:var(--accent-bg3)}
.check-col{width:32px;text-align:center}
.check-col input[type=checkbox]{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}
.thumb-col{width:56px}
.thumb{width:48px;height:30px;border-radius:4px;object-fit:cover;background:var(--bg2);display:block}
.thumb.hidden{display:none}
.thumb.hidden+.thumb-ph{display:flex}
.thumb-ph{display:none;width:48px;height:30px;border-radius:4px;background:var(--bg2);align-items:center;justify-content:center}
.thumb-ph svg{width:16px;height:16px;fill:var(--text3)}
.name-cell{font-weight:500;color:var(--text);cursor:pointer;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-cell:hover{color:var(--accent)}
.sub-col{text-align:center}
.sub-yes{color:var(--success);font-size:12px;font-weight:500}
.sub-no{color:var(--text3);font-size:12px;cursor:pointer;border:1px dashed var(--border);border-radius:3px;padding:2px 6px;transition:color .15s,border-color .15s}
.sub-no:hover{color:var(--accent);border-color:var(--accent)}
.action-col{width:36px;text-align:center}
.action-btn{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px 6px;border-radius:4px;transition:all .1s;line-height:1}
.action-btn:hover{background:var(--hover);color:var(--text)}
/* Empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--text3)}
.empty-state .icon{font-size:36px;margin-bottom:8px}
.empty-state p{font-size:13px}
/* Article cells */
.word-col,.chapter-col{color:var(--text2);font-size:12px}
.title-cell{font-weight:500;color:var(--text);cursor:pointer;max-width:250px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-cell:hover{color:var(--accent)}
/* Modal overlay */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:var(--bg3);border-radius:12px;border:1px solid var(--border);width:90%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);flex-shrink:0}
.modal-header h3{font-size:15px;color:var(--text)}
.modal-close{background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:2px 6px;border-radius:4px}
.modal-close:hover{color:var(--text);background:var(--hover)}
.modal-body{flex:1;overflow:auto;padding:14px 18px}
.modal-body textarea{width:100%;min-height:260px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:12px;font-family:'SF Mono','Fira Code','Consolas',monospace;font-size:13px;line-height:1.6;resize:vertical;outline:none;overflow-y:auto}
.modal-body textarea:focus{border-color:var(--accent)}
.modal-body input[type=text]{width:100%;padding:10px 12px;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.modal-body input[type=text]:focus{border-color:var(--accent)}
.modal-body .field-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid var(--border);flex-shrink:0}
/* Context menu */
.context-menu{position:fixed;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:4px;z-index:200;min-width:120px;box-shadow:0 8px 24px var(--shadow)}
.context-menu button{display:block;width:100%;text-align:left;padding:7px 12px;border:none;background:none;color:var(--text2);font-size:13px;cursor:pointer;border-radius:4px;font-family:inherit}
.context-menu button:hover{background:var(--accent);color:#fff}
</style>
</head>
<body>

<div class="header">
  <h1>VidLang</h1>
  <div class="sub">WiFi 传输</div>
</div>

<div class="upload-status-bar" id="uploadStatusBar">
  <div class="upload-status-content">
    <div class="upload-status-icon"></div>
    <div class="upload-status-text" id="uploadStatusText">正在上传...</div>
    <div class="upload-status-progress" id="uploadStatusProgress">0%</div>
  </div>
  <div class="upload-progress-bar">
    <div class="upload-progress-fill" id="uploadProgressFill"></div>
  </div>
</div>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-title">资源列表</div>
    <div class="tree" id="tree"></div>
  </div>

  <!-- Content -->
  <div class="content">
    <div class="content-header" id="contentHeader">
      <div class="breadcrumb">请从左侧选择一个文件夹</div>
    </div>

    <div class="upload-area" id="uploadArea" style="display:none">
      <div class="upload-zone" id="uploadZone">
        <div class="icon">📁</div>
        <p id="uploadText">点击选择文件 或 拖拽到此处</p>
        <div class="ext-hint" id="extHint"></div>
      </div>
      <input type="file" id="fileInput" style="display:none" multiple/>
    </div>

    <!-- Article create button (shown for article folders) -->
    <div id="articleCreateArea" style="display:none;margin-bottom:8px;flex-shrink:0">
      <button class="btn btn-primary" onclick="openArticleEditor()">＋ 新建文章</button>
    </div>

    <div class="toolbar" id="toolbar" style="display:none">
      <div class="toolbar-left">
        <label style="display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px;color:#888">
          <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" style="accent-color:var(--accent)"/> 全选
        </label>
        <span class="selected-count" id="selectedCount"></span>
      </div>
      <div class="toolbar-right">
        <button class="btn btn-danger" id="deleteSelectedBtn" disabled onclick="deleteSelected()">删除选中</button>
      </div>
    </div>

    <div class="table-wrap" id="tableWrap" style="display:none">
      <table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="icon">📂</div>
      <p>选择文件夹以查看资源</p>
    </div>
  </div>
</div>

<!-- Context menu -->
<div class="context-menu" id="contextMenu" style="display:none"></div>

<script>
// ===== State =====
let folders = [];           // all folders from API
let currentFolder = null;   // selected folder
let currentResources = [];  // resources in current folder
let selectedCodes = new Set();
let contextTarget = null;   // {type, code} for context menu

// Upload state
let isUploading = false;
let uploadingCount = 0;
let uploadingTotal = 0;
let uploadingFileName = '';

const CATEGORIES = [
  {type:'video', label:'视频', icon:'<svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg>', exts:['.mp4','.mov','.avi','.mkv','.webm','.flv','.wmv'], subExts:['.srt','.ass','.ssa','.vtt'], uploadLabel:'mp4 / mov / avi / mkv … 字幕：srt / ass / vtt'},
  {type:'music', label:'音频', icon:'<svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>', exts:['.mp3','.wav','.m4a','.aac','.flac','.ogg','.wma','.mp4','.mov','.avi','.mkv','.webm','.flv','.wmv'], subExts:['.lrc','.srt','.ass','.ssa','.vtt'], uploadLabel:'mp3 / wav / m4a / mp4 / mov … 字幕：lrc / srt / ass / vtt'},
  {type:'article',label:'文章', icon:'<svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>', exts:['.txt','.md','.markdown'], uploadLabel:'txt / md'},
];

// ===== Init =====
document.addEventListener('DOMContentLoaded',()=>{
  setupUpload();
  renderTree(); // render empty tree with 3 category nodes first
  loadFolders(); // then async load folders to populate
});

function baseUrl(){ return window.location.origin; }

// ===== Upload Status =====
function updateUploadStatus(){
  const statusBar=document.getElementById('uploadStatusBar');
  const statusText=document.getElementById('uploadStatusText');
  const statusProgress=document.getElementById('uploadStatusProgress');
  const progressFill=document.getElementById('uploadProgressFill');
  
  if(!isUploading || uploadingTotal===0){
    statusBar.classList.remove('active');
    return;
  }
  
  statusBar.classList.add('active');
  const percent=Math.round((uploadingCount/uploadingTotal)*100);
  statusText.innerHTML=`正在上传 <strong>${escHtml(uploadingFileName)}</strong> (${uploadingCount}/${uploadingTotal})`;
  statusProgress.textContent=percent+'%';
  progressFill.style.width=percent+'%';
}

function startUpload(fileName,total){
  isUploading=true;
  uploadingCount=0;
  uploadingTotal=total;
  uploadingFileName=fileName;
  updateUploadStatus();
  
  // Disable folder switching during upload
  document.querySelectorAll('.folder-item').forEach(el=>{
    el.style.pointerEvents='none';
    el.style.opacity='0.5';
  });
}

function updateUploadProgress(fileName,count){
  uploadingFileName=fileName;
  uploadingCount=count;
  updateUploadStatus();
}

function finishUpload(){
  isUploading=false;
  uploadingCount=0;
  uploadingTotal=0;
  uploadingFileName='';
  updateUploadStatus();
  
  // Re-enable folder switching
  document.querySelectorAll('.folder-item').forEach(el=>{
    el.style.pointerEvents='';
    el.style.opacity='';
  });
}

// ===== API =====
async function api(path,options={}){
  const res=await fetch(baseUrl()+path,{...options,headers:{'Content-Type':'application/json',...options.headers}});
  const data=await res.json();
  if(!data.ok) throw new Error(data.message||'请求失败');
  return data;
}

// ===== Folders =====
async function loadFolders(){
  try{
    const data=await api('/api/folders');
    folders=data.data||[];
    renderTree();
    if(currentFolder){
      const found=folders.find(f=>f.code===currentFolder.code);
      if(found) selectFolder(found);
      else{ currentFolder=null; renderContent(); }
    }
  }catch(e){ console.error(e); }
}

async function createFolder(catType){
  const name=prompt(`请输入${CATEGORIES.find(c=>c.type===catType)?.label||''}文件夹名称`,'');
  if(!name||!name.trim()) return;
  try{
    await api('/api/folders',{method:'POST',body:JSON.stringify({name:name.trim(),type:'virtual',contentType:catType})});
    await loadFolders();
    // auto-select the new folder
    const data=await api('/api/folders?contentType='+catType);
    const newF=(data.data||[]).find(f=>f.name===name.trim());
    if(newF) selectFolder(newF);
  }catch(e){ alert('创建失败: '+e.message); }
}

async function deleteFolder(folderCode){
  if(!confirm('确定要删除此文件夹及其所有资源吗？此操作不可恢复。')) return;
  try{
    await api('/api/folders/'+folderCode,{method:'DELETE'});
    if(currentFolder&&currentFolder.code===folderCode){ currentFolder=null; }
    await loadFolders();
  }catch(e){ alert('删除失败: '+e.message); }
}

function getFolderIcon(type){
  return '<svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>';
}

// ===== Tree =====
function renderTree(){
  const tree=document.getElementById('tree');
  let html='';
  for(const cat of CATEGORIES){
    const children=folders.filter(f=>f.folderType===cat.type);
    html+=`<div class="category">
      <div class="cat-header">
        <span class="cat-icon">${cat.icon}</span>
        <span class="cat-label">${cat.label}</span>
        <span class="cat-add" onclick="event.stopPropagation();createFolder('${cat.type}')" title="新建文件夹">+</span>
      </div>
      <div class="cat-children">`;
    for(const f of children){
      const active=currentFolder&&currentFolder.code===f.code?' active':'';
      html+=`<div class="folder-item${active}" onclick="selectFolder(folders.find(ff=>ff.code==='${f.code}'))">
        <span class="f-icon">${getFolderIcon(f.folderType)}</span>
        <span class="f-name">${f.name}</span>
        <span class="f-del" onclick="event.stopPropagation();deleteFolder('${f.code}')" title="删除">✕</span>
      </div>`;
    }
    html+=`</div></div>`;
  }
  tree.innerHTML=html;
}

// ===== Select Folder =====
function selectFolder(folder){
  if(isUploading){alert('文件正在上传中，请等待完成后再切换');return}
  currentFolder=folder;
  selectedCodes.clear();
  renderTree();
  renderContent();
}

function getCategory(type){
  return CATEGORIES.find(c=>c.type===type)||CATEGORIES[0];
}

// ===== Content =====
async function renderContent(){
  const header=document.getElementById('contentHeader');
  const uploadArea=document.getElementById('uploadArea');
  const articleCreate=document.getElementById('articleCreateArea');
  const toolbar=document.getElementById('toolbar');
  const tableWrap=document.getElementById('tableWrap');
  const empty=document.getElementById('emptyState');

  if(!currentFolder){
    header.innerHTML='<div class="breadcrumb">请从左侧选择一个文件夹</div>';
    uploadArea.style.display='none'; articleCreate.style.display='none'; toolbar.style.display='none'; tableWrap.style.display='none';
    empty.style.display='flex'; empty.querySelector('p').textContent='选择文件夹以查看资源';
    return;
  }

  const cat=getCategory(currentFolder.folderType);
  header.innerHTML=`<div class="breadcrumb">当前分类：<strong>${cat.label}</strong> › ${currentFolder.name}</div>`;

  // Upload zone
  uploadArea.style.display='block';
  document.getElementById('uploadText').textContent=`点击选择文件 或 拖拽到此处`;
  document.getElementById('extHint').textContent=`仅支持：${cat.uploadLabel}`;

  // Article create button
  if(currentFolder.folderType==='article'){
    articleCreate.style.display='block';
  }else{
    articleCreate.style.display='none';
  }

  // Load resources
  await loadResources(currentFolder);
  toolbar.style.display='flex';
  tableWrap.style.display='block';
  empty.style.display='none';
  updateToolbar();
  renderTable();
}

async function loadResources(folder){
  try{
    if(folder.folderType==='article'){
      const data=await api('/api/folders/'+folder.code+'/articles');
      currentResources=data.data||[];
    }else{
      const data=await api('/api/folders/'+folder.code+'/videos');
      currentResources=data.data||[];
    }
  }catch(e){
    currentResources=[];
  }
  // Unset any deleted codes
  const validCodes=new Set(currentResources.map(r=>r.code));
  for(const c of selectedCodes){ if(!validCodes.has(c)) selectedCodes.delete(c); }
}

function renderTable(){
  const thead=document.getElementById('tableHead');
  const tbody=document.getElementById('tableBody');

  if(currentResources.length===0){
    document.getElementById('tableWrap').style.display='none';
    document.getElementById('emptyState').style.display='flex';
    document.getElementById('emptyState').querySelector('p').textContent='暂无资源，请上传';
    return;
  }
  document.getElementById('tableWrap').style.display='block';
  document.getElementById('emptyState').style.display='none';

  const cat=getCategory(currentFolder.folderType);
  const isArticle=currentFolder.folderType==='article';

  let headHtml='<tr><th class="check-col"></th>';
  if(!isArticle){
    headHtml+='<th class="thumb-col"></th><th>名称</th><th>时长</th><th>字幕</th>';
  }else{
    headHtml+='<th>标题</th><th>字数</th><th>段落</th>';
  }
  headHtml+='<th class="action-col"></th></tr>';
  thead.innerHTML=headHtml;

  let bodyHtml='';
  for(const r of currentResources){
    const checked=selectedCodes.has(r.code)?'checked':'';
    bodyHtml+='<tr class="'+(checked?'selected':'')+'" id="row-'+r.code+'">';
    bodyHtml+=`<td class="check-col"><input type="checkbox" ${checked} onchange="toggleRow('${r.code}')"/></td>`;
    if(!isArticle){
      // thumbnail
      const coverUrl=baseUrl()+'/api/videos/'+r.code+'/cover';
      const dur=formatDuration(r.duration);
      const sub=r.hasSubtitles?'<span class="sub-yes">有</span>':'<span class="sub-no" onclick="event.stopPropagation();uploadSubtitle(\''+r.code+'\')" title="点击上传字幕">+ 字幕</span>';
      bodyHtml+=`<td class="thumb-col"><img class="thumb" src="${coverUrl}" loading="lazy" onerror="this.classList.add('hidden')"/><div class="thumb-ph">${cat.icon}</div></td>`;
      bodyHtml+=`<td><span class="name-cell" onclick="renameResource('${r.code}','${escHtml(r.name)}')">${escHtml(r.name)}</span></td>`;
      bodyHtml+=`<td>${dur}</td><td class="sub-col">${sub}</td>`;
    }else{
      bodyHtml+=`<td><span class="title-cell" onclick="renameResource('${r.code}','${escHtml(r.title||'')}')">${escHtml(r.title||'')}</span></td>`;
      bodyHtml+=`<td class="word-col">${r.wordCount??0}</td><td class="chapter-col">${r.totalParagraphs??0}</td>`;
    }
    bodyHtml+=`<td class="action-col"><button class="action-btn" onclick="showContextMenu(event,'${r.code}','${isArticle?'article':'video'}')">···</button></td>`;
    bodyHtml+='</tr>';
  }
  tbody.innerHTML=bodyHtml;
}

function escHtml(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;').replace(/"/g,'&quot;');
}
function escAttr(s){
  if(!s) return '';
  return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatDuration(ms){
  if(!ms||ms<=0) return '--:--';
  const s=Math.floor(ms/1000);
  const m=Math.floor(s/60);
  const sec=s%60;
  return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// ===== Upload =====
function setupUpload(){
  const zone=document.getElementById('uploadZone');
  const input=document.getElementById('fileInput');
  zone.addEventListener('click',()=>input.click());
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('dragover')});
  zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
  zone.addEventListener('drop',e=>{e.preventDefault();zone.classList.remove('dragover');handleFiles(e.dataTransfer.files)});
  input.addEventListener('change',()=>{if(input.files.length)handleFiles(input.files);input.value=''});
}

async function handleFiles(fileList){
  if(!currentFolder){alert('请先选择文件夹');return}
  const cat=getCategory(currentFolder.folderType);
  const files=Array.from(fileList);

  // Count total files to upload
  let totalFiles=0;
  if(currentFolder.folderType==='article'){
    for(const f of files){
      const ext='.'+f.name.split('.').pop().toLowerCase();
      if(cat.exts.includes(ext)) totalFiles++;
    }
  }else{
    const subExts=cat.subExts||[];
    for(const f of files){
      const ext='.'+f.name.split('.').pop().toLowerCase();
      if(subExts.includes(ext)){
        // Check if it has a matching video
        const hasMatchingVideo=files.some(vf=>{
          const vExt='.'+vf.name.split('.').pop().toLowerCase();
          return cat.exts.includes(vExt) && findMatchingSubtitle(vf.name,[f],subExts);
        });
        if(!hasMatchingVideo) totalFiles++;
      }else if(cat.exts.includes(ext)){
        totalFiles++;
      }
    }
  }
  
  if(totalFiles===0){alert('没有可上传的文件');return}
  
  // Start upload status
  startUpload(files[0]?.name||'上传中',totalFiles);
  let uploadedCount=0;

  if(currentFolder.folderType==='article'){
    for(const f of files){
      const ext='.'+f.name.split('.').pop().toLowerCase();
      if(!cat.exts.includes(ext)){continue}
      updateUploadProgress(f.name,uploadedCount);
      const text=await f.text();
      await uploadArticleContent(f.name,text);
      uploadedCount++;
      updateUploadProgress(f.name,uploadedCount);
    }
    finishUpload();
    await loadResources(currentFolder);
    renderTable();
    return;
  }

  // Video / Audio upload
  const subExts=cat.subExts||[];
  const videoFiles=[];
  const subtitleFiles=[];
  for(const f of files){
    const ext='.'+f.name.split('.').pop().toLowerCase();
    if(subExts.includes(ext)){subtitleFiles.push(f);continue}
    if(!cat.exts.includes(ext))continue;
    videoFiles.push(f);
  }
  // Upload videos and auto-match subtitles
  for(const vf of videoFiles){
    updateUploadProgress(vf.name,uploadedCount);
    const result=await uploadFile(vf);
    // Find matching subtitle file by stem (e.g. ceshi6.mp4 → ceshi6.en.srt)
    if(result&&result.code&&subtitleFiles.length>0){
      const matchedSub=findMatchingSubtitle(vf.name,subtitleFiles,subExts);
      if(matchedSub){
        await uploadSubtitleDirect(result.code,matchedSub);
      }
    }
    uploadedCount++;
    updateUploadProgress(vf.name,uploadedCount);
  }
  finishUpload();
  await loadResources(currentFolder);
  renderTable();
}

async function uploadFile(file){
  return new Promise((resolve,reject)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('PUT',baseUrl()+'/api/folders/'+currentFolder.code+'/upload?filename='+encodeURIComponent(file.name),true);
    xhr.upload.onprogress=e=>{
      if(e.lengthComputable){
        const filePercent=Math.round(e.loaded/e.lengthComputable*100);
        document.getElementById('uploadText').textContent=`上传中 ${file.name} (${filePercent}%)`;
        // Update status bar with file-level progress
        if(isUploading){
          const overallPercent=Math.round(((uploadingCount+e.loaded/e.lengthComputable)/uploadingTotal)*100);
          document.getElementById('uploadStatusProgress').textContent=overallPercent+'%';
          document.getElementById('uploadProgressFill').style.width=overallPercent+'%';
        }
      }
    };
    xhr.onload=()=>{
      document.getElementById('uploadText').textContent='点击选择文件 或 拖拽到此处';
      if(xhr.status>=200&&xhr.status<300){
        try{const d=JSON.parse(xhr.responseText);resolve(d.data||d)}catch(_){resolve(null)}
      }else reject(new Error('上传失败'));
    };
    xhr.onerror=()=>reject(new Error('上传失败'));
    xhr.send(file);
  });
}

function getFileStem(filename){
  const lastDot = filename.lastIndexOf('.');
  return lastDot > 0 ? filename.substring(0, lastDot) : filename;
}

function findMatchingSubtitle(videoName, subtitleFiles, subExts){
  const videoStem = getFileStem(videoName);
  for(const sf of subtitleFiles){
    const subName = sf.name;
    // Remove subtitle extension first (e.g. .srt)
    const withoutSubExt = getFileStem(subName);
    // Check exact match: ceshi6.srt → stem is "ceshi6"
    if(withoutSubExt === videoStem) return sf;
    // Check with language suffix: ceshi6.en.srt → withoutSubExt is "ceshi6.en", starts with "ceshi6."
    if(withoutSubExt.startsWith(videoStem + '.')) return sf;
  }
  return null;
}

async function uploadSubtitleDirect(videoCode, file){
  return new Promise((resolve)=>{
    const xhr=new XMLHttpRequest();
    xhr.open('PUT',baseUrl()+'/api/videos/'+videoCode+'/subtitle?filename='+encodeURIComponent(file.name),true);
    xhr.onload=()=>{
      if(xhr.status>=200&&xhr.status<300) resolve(true);
      else resolve(false);
    };
    xhr.onerror=()=>resolve(false);
    xhr.send(file);
  });
}

async function uploadArticleContent(filename,content){
  const blob=new Blob([content],{type:'text/plain'});
  const xhr=new XMLHttpRequest();
  xhr.open('PUT',baseUrl()+'/api/folders/'+currentFolder.code+'/article?filename='+encodeURIComponent(filename),true);
  xhr.onload=()=>{};
  xhr.send(blob);
}

async function uploadSubtitle(videoCode){
  const input=document.createElement('input');
  input.type='file';
  const cat=getCategory(currentFolder.folderType);
  input.accept=(cat.subExts||['.srt','.ass','.ssa','.vtt']).join(',');
  input.onchange=async()=>{
    const f=input.files[0];
    if(!f) return;
    const xhr=new XMLHttpRequest();
    xhr.open('PUT',baseUrl()+'/api/videos/'+videoCode+'/subtitle?filename='+encodeURIComponent(f.name),true);
    xhr.onload=async()=>{
      if(xhr.status>=200&&xhr.status<300){
        await loadResources(currentFolder);
        renderTable();
      }
    };
    xhr.send(f);
  };
  input.click();
}

// ===== Selection =====
function toggleRow(code){
  if(selectedCodes.has(code)) selectedCodes.delete(code);
  else selectedCodes.add(code);
  updateToolbar();
  const row=document.getElementById('row-'+code);
  if(row) row.className=selectedCodes.has(code)?'selected':'';
}

function toggleSelectAll(){
  const sel=document.getElementById('selectAll').checked;
  for(const r of currentResources){
    if(sel) selectedCodes.add(r.code); else selectedCodes.delete(r.code);
  }
  updateToolbar();
  renderTable();
}

function updateToolbar(){
  const selCount=document.getElementById('selectedCount');
  selCount.textContent=selectedCodes.size>0?`已选 ${selectedCodes.size} 项`:'';
  document.getElementById('deleteSelectedBtn').disabled=selectedCodes.size===0;
  document.getElementById('selectAll').checked=currentResources.length>0&&selectedCodes.size===currentResources.length;
}

async function deleteSelected(){
  if(selectedCodes.size===0) return;
  if(!confirm(`确定删除选中的 ${selectedCodes.size} 个资源吗？`)) return;
  const codes=Array.from(selectedCodes);
  try{
    const isArticle=currentFolder&&currentFolder.folderType==='article';
    const endpoint=isArticle?'/api/articles/batch_delete':'/api/videos/batch_delete';
    await api(endpoint,{method:'POST',body:JSON.stringify({codes})});
    selectedCodes.clear();
    await loadResources(currentFolder);
    renderTable();
  }catch(e){ alert('删除失败: '+e.message); }
}

// ===== Context Menu =====
function showContextMenu(event,code,type){
  event.stopPropagation();
  closeContextMenu();
  contextTarget={code,type};
  const menu=document.getElementById('contextMenu');
  let items='';
  items+=`<button onclick="contextAction('rename')">✏️ 重命名</button>`;
  if(type==='article'){
    items+=`<button onclick="contextAction('edit')">📝 编辑内容</button>`;
  }
  items+=`<button onclick="contextAction('delete')" style="color:var(--danger)">🗑️ 删除</button>`;
  menu.innerHTML=items;
  menu.style.display='block';
  const x=Math.min(event.clientX,document.documentElement.clientWidth-140);
  const y=Math.min(event.clientY,document.documentElement.clientHeight-120);
  menu.style.left=x+'px';menu.style.top=y+'px';
  setTimeout(()=>document.addEventListener('click',closeContextMenu,{once:true}),10);
}

function closeContextMenu(){
  document.getElementById('contextMenu').style.display='none';
}

async function contextAction(action){
  closeContextMenu();
  if(!contextTarget) return;
  const{code,type}=contextTarget;
  switch(action){
    case 'rename': renameResource(code,''); break;
    case 'edit':
      if(type==='article') openArticleEditor(code);
      break;
    case 'delete':
      if(!confirm('确定删除此资源吗？')) return;
      try{
        const endpoint=type==='article'?'/api/articles/'+code:'/api/videos/'+code;
        await api(endpoint,{method:'DELETE'});
        await loadResources(currentFolder);
        renderTable();
      }catch(e){alert('删除失败: '+e.message)}
      break;
  }
}

async function renameResource(code,currentName){
  const name=prompt('重命名：',currentName||'');
  if(!name||!name.trim()) return;
  try{
    const isArticle=currentFolder&&currentFolder.folderType==='article';
    const endpoint=isArticle?'/api/articles/'+code:'/api/videos/'+code;
    await api(endpoint,{method:'PATCH',body:JSON.stringify({name:name.trim()})});
    await loadResources(currentFolder);
    renderTable();
  }catch(e){alert('重命名失败: '+e.message)}
}

// ===== Article Editor =====
function openArticleEditor(editCode){
  const overlay=document.createElement('div');
  overlay.className='modal-overlay';
  const existing=currentResources.find(r=>r.code===editCode);
  const isEdit=!!editCode;
  overlay.innerHTML=`
    <div class="modal">
      <div class="modal-header">
        <h3>${isEdit?'编辑文章':'新建文章'}</h3>
        <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div class="modal-body">
        <label class="field-label">标题</label>
        <input type="text" id="articleTitle" placeholder="请输入文章标题" value="${escAttr(existing?existing.title||'':'')}"/>
        <label class="field-label">内容（Markdown）</label>
        <textarea id="articleEditor" placeholder="在此编写 Markdown 内容…">${escHtml(existing?existing.contentMarkdown||'':'')}</textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
        <button class="btn btn-primary" onclick="saveArticle('${editCode||''}')">保存</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

async function saveArticle(editCode){
  const titleInput=document.getElementById('articleTitle');
  const textarea=document.getElementById('articleEditor');
  if(!textarea) return;
  const title=(titleInput?.value??'').trim();
  const content=textarea.value.trim();
  if(!title){alert('标题不能为空');return}
  if(!content){alert('内容不能为空');return}
  try{
    if(editCode){
      // Update existing article
      await api('/api/articles/'+editCode,{method:'PATCH',body:JSON.stringify({name:title,contentMarkdown:content})});
    }else{
      // Create new
      const filename='article_'+Date.now()+'.md';
      const blob=new Blob([content],{type:'text/plain'});
      const xhr=new XMLHttpRequest();
      const url=baseUrl()+'/api/folders/'+currentFolder.code+'/article?filename='+encodeURIComponent(filename)+'&title='+encodeURIComponent(title);
      xhr.open('PUT',url,true);
      xhr.onload=async()=>{
        if(xhr.status>=200&&xhr.status<300){
          document.querySelector('.modal-overlay')?.remove();
          await loadResources(currentFolder);
          renderTable();
        }
      };
      xhr.send(blob);
      return;
    }
    document.querySelector('.modal-overlay')?.remove();
    await loadResources(currentFolder);
    renderTable();
  }catch(e){alert('保存失败: '+e.message)}
}
